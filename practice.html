<section>
<h2>اليوم 1: الأسس والتقبّل والسياق</h2>
<ol>
<li><p>قدّم فريق في مستشفى افتراضي جدولًا يقابل كل نشاط في إجراءاته بوظيفة في إطار NIST، وكتب في عنوانه: «نحن ممتثلون لإطار NIST». ما الرد الأدق؟</p><ul><li><b>أ.</b> العنوان صحيح ما دام كل نشاط وجد وظيفة تقابله</li><li><b>ب.</b> الجدول يبيّن موقع الأنشطة، والتطبيق يحتاج دليلًا آخر</li><li><b>ج.</b> العنوان خاطئ لأن الامتثال يُعلن فقط بعد شهادة رسمية من NIST</li><li><b>د.</b> الجدول لا قيمة له لأن بعض البنود لا مقابل لها</li></ul></li>
<li><p>في بيان مستشفى افتراضي: «لا نقبل أكثر من رسالتي تذكير خاطئتين بالدواء لكل عشرة آلاف رسالة في الشهر». ما هذه الجملة؟</p><ul><li><b>أ.</b> جملة تقبّل، لأنها تقول ما تقبله الإدارة وما لا تقبله</li><li><b>ب.</b> حد للقدرة، لأنها أقصى ما يحتمله المستشفى</li><li><b>ج.</b> حد تحمّل، لأن لها مؤشرًا وعتبة ونافذة زمنية تُقاس كل شهر</li><li><b>د.</b> مؤشر أداء للخدمة، لأنها تحمل رقمًا شهريًا</li></ul></li>
<li><p>بيان المستشفى: مواعيد عند طبيب غائب، أصفر عند 2 وأحمر عند 5 لكل ألف حجز في الأسبوع. هذا الأسبوع 5 بالضبط. ما الحالة ومسارها؟</p><ul><li><b>أ.</b> أصفر، لأن القيمة لم تتجاوز الخمسة بعد</li><li><b>ب.</b> أحمر، ويذهب فورًا إلى مسؤول حماية البيانات في المستشفى</li><li><b>ج.</b> أحمر، ويكفي أن يعالجه مالك النظام مع فريقه</li><li><b>د.</b> أحمر، ويذهب إلى الرئيس التنفيذي للمخاطر وإلى لجنة المخاطر لتقرر</li></ul></li>
<li><p>وصف مساعد المستشفى يقول: «للمرضى البالغين فقط». ومسار الخدمة يقول: «يحجز الوالد موعد طفله بإدخال رقم ملف الطفل». ماذا تكتب في ورقة النطاق؟</p><ul><li><b>أ.</b> الوصف، لأنه الوثيقة التي تحدد نطاق النظام</li><li><b>ب.</b> تعارضًا: بيانات أطفال تدخل نظامًا وُصف للبالغين</li><li><b>ج.</b> ضابطًا يمنع حجز مواعيد الأطفال عبر المساعد فورًا قبل الإطلاق</li><li><b>د.</b> لا شيء، لأن الوالد هو من أدخل بيانات طفله بنفسه</li></ul></li>
<li><p>تراجع جهة صحية افتراضية إجراءاتها على الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. فريقها بدأ مباشرة بورشة لتحديد المخاطر. ما الذي فاته بحسب بنية الإطار؟</p><ul><li><b>أ.</b> تقدير الاحتمالية والأثر لكل خطر قبل الورشة</li><li><b>ب.</b> تحديد السياق والنطاق: النظام وبياناته وأتمتته ودورة حياته</li><li><b>ج.</b> اختيار خيار المعالجة الأنسب لكل نظام قبل البدء</li><li><b>د.</b> إعداد مؤشرات المخاطر الرئيسة لكل نظام في الجهة قبل الورشة وبعدها بأسابيع</li></ul></li>
<li><p>يقابل محلل نشاط «إعادة تقييم الخطر المتبقي بعد تنفيذ الضوابط» بوظائف إطار NIST للذكاء الاصطناعي. أي وظيفة هي الأقرب؟</p><ul><li><b>أ.</b> GOVERN، لأن قرار القبول قرار حوكمة في الجهة</li><li><b>ب.</b> MAP، لأن المتبقي يغيّر سياق النظام المعروف</li><li><b>ج.</b> MEASURE، لأنه تقدير جديد للاحتمالية والأثر بعد الضوابط</li><li><b>د.</b> لا وظيفة تقابله، لأن NIST لا يعرف المتبقي</li></ul></li>
<li><p>يقول عضو في لجنة: «جدول المقابلة بين إجراءاتنا وISO/IEC 23894 يثبت أننا نطبق المواصفة». ما الرد الأدق؟</p><ul><li><b>أ.</b> الجدول يثبت التطبيق إذا غطى كل بنود المواصفة</li><li><b>ب.</b> المواصفة إرشادية، فلا يُسأل أحد عن تطبيقها</li><li><b>ج.</b> الجدول يبيّن أين تقع الأنشطة، والتطبيق يثبته الدليل</li><li><b>د.</b> لا يصح الجدول لأن المواصفة مبنية على ISO 31000 لا على إطار وطني</li></ul></li>
<li><p>سياسة جهة افتراضية تقول: «لا نقبل أي انتهاك للبيانات الشخصية». واستراتيجيتها تقول: «نقبل أن يعمل المساعد دون مراجعة بشرية لكل إجابة». أي مستوى تقبّل يناسب فئة الخصوصية والأمن؟</p><ul><li><b>أ.</b> منفتح، لأن الاستراتيجية تقبل العمل دون مراجعة</li><li><b>ب.</b> حذر، لأن الوثيقتين تتوازنان في هذه الفئة</li><li><b>ج.</b> منخفض، لأن بعض الانتهاكات لا تُمنع</li><li><b>د.</b> متجنّب، لأن السياسة لا تقبل أي انتهاك</li></ul></li>
<li><p>حد تحمّل في جهة افتراضية: «نسبة الإجابات الخاطئة في عينة الأسبوع: أصفر عند 5%، وأحمر عند 8%». القيمة هذا الأسبوع 8%. ما الحالة؟</p><ul><li><b>أ.</b> أصفر: القيمة لم تتجاوز الثمانية</li><li><b>ب.</b> أحمر: القيمة تبلغ العتبة</li><li><b>ج.</b> أخضر إلى أن يتكرر أسبوعين متتاليين</li><li><b>د.</b> لا حكم: البيان لا يذكر حجم العينة</li></ul></li>
<li><p>أي هذه الجمل حد تحمّل يصلح للإنذار المبكر؟</p><ul><li><b>أ.</b> نسعى إلى رضا عالٍ ومستمر عن المساعد الذكي في كل القنوات</li><li><b>ب.</b> لا نقبل أخطاء جوهرية في معلومات الرسوم الرسمية</li><li><b>ج.</b> أخطاء الرسوم في عينة 60 إجابة أسبوعيًا: أصفر عند 3</li><li><b>د.</b> نراجع أداء المساعد كلما لزم الأمر مع مالك النظام</li></ul></li>
<li><p>وصف مساعد في جهة افتراضية يقول: «يقترح المواعيد والمستخدم يختار». ومسار الخدمة يقول: «إذا لم يرد المستخدم خلال دقيقتين يحجز المساعد أول موعد». ما مستوى الأتمتة الذي تكتبه في ورقة النطاق؟</p><ul><li><b>أ.</b> تنفيذ دون تأكيد في حالة عدم الرد، مع ذكر التعارض</li><li><b>ب.</b> توصية فقط، لأن الوصف هو الوثيقة المعتمدة</li><li><b>ج.</b> قرار بشري، لأن المستخدم يستطيع أن يلغي الحجز</li><li><b>د.</b> لا يُكتب شيء حتى يتفق الفريقان على وثيقة واحدة معتمدة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: تحديد المخاطر</h2>
<ol>
<li><p>وصف مساعد مواعيد في مستشفى افتراضي يقول: «لا يحجز إلا بعد تأكيد المريض»، وتقرير التشغيل يقول: «مواعيد المتابعة تُحجز تلقائيًا». ماذا تفعل بهذا قبل ورشة التحديد؟</p><ul><li><b>أ.</b> تكتبه تعارضًا في ورقة النطاق، فهو مصدر خطر يُكتب في السجل</li><li><b>ب.</b> تعتمد الوصف لأنه الوثيقة الرسمية المعتمدة من الإدارة، وتترك تقرير التشغيل جانبًا</li><li><b>ج.</b> توصي بإيقاف الحجز التلقائي فورًا قبل أي ورشة أو تقدير</li><li><b>د.</b> تطلب تصحيح الوصف ثم تبدأ الورشة كأن شيئًا لم يكن</li></ul></li>
<li><p>ملاحظات مقابلات مساعد المواعيد الافتراضي تذكر المرضى والأطباء وموظفي الاستقبال، وتقول: «40% من المواعيد لمراجعين يرافقهم شخص». من الفئة التي لم تُذكر ويحمل النظام خطرًا عليها؟</p><ul><li><b>أ.</b> موظفو الاستقبال الذين يستلمون الحالات المحوّلة</li><li><b>ب.</b> مورّد أجهزة المختبر في المستشفى وفنيو الصيانة الذين يعملون لديه</li><li><b>ج.</b> فريق تقنية المعلومات الذي يشغّل المساعد يوميًا</li><li><b>د.</b> المرافقون الذين يحجزون أو يُبلَّغون نيابة عن المريض</li></ul></li>
<li><p>أربع صيغ من سجل مساعد المواعيد الافتراضي. أيها خطر مكتمل يمكن أن يُقدَّر غدًا؟</p><ul><li><b>أ.</b> تاريخ هجري يُقرأ ميلاديًا، فيُحجز يوم خاطئ ويفوت المريض موعده</li><li><b>ب.</b> قائمة الأطباء في المساعد لا تُحدَّث إلا مرة في الأسبوع</li><li><b>ج.</b> ضرر بسمعة المستشفى إن أخطأ المساعد في المواعيد</li><li><b>د.</b> قد يرتكب المساعد أخطاء متكررة في التعامل مع المرضى ومواعيدهم في العيادات</li></ul></li>
<li><p>مسار مساعد المواعيد الافتراضي: (1) يختار المريض العيادة، (2) يحجز المساعد، (3) يرسل تذكيرًا إلى الجوال المسجل، (4) يحوّل إلى موظف عند الطلب. أي خطوة يفشل فيها النظام دون أن يعرف أحد؟</p><ul><li><b>أ.</b> التحويل إلى موظف، لأنه قد يتأخر في أوقات الذروة</li><li><b>ب.</b> اختيار العيادة، لأن المريض قد يصف أعراضه باختصار</li><li><b>ج.</b> التذكير: الرقم القديم لا يرد ولا يُبلِغ أحدًا</li><li><b>د.</b> الحجز نفسه، لأن الأداة قد تحجز في موعد ممتلئ أو مغلق</li></ul></li>
<li><p>في سجل مساعد المواعيد الافتراضي خطر: «القائمة لا تُحدَّث، فيُحجز موعد عند طبيب غائب، فيأتي المريض بلا فائدة». أي حادثة من سجل عام مكررة لهذا الخطر، فتُضاف إلى مصدره ولا تُكتب خطرًا جديدًا؟</p><ul><li><b>أ.</b> مساعد عيادة أرسل تذكيرًا فيه تشخيص المريض إلى رقم قريبه</li><li><b>ب.</b> مساعد عيادة حجز مواعيد عند طبيب انتهى عقده لأن جدوله لم يُحدَّث</li><li><b>ج.</b> نظام مواقف في مستشفى أخطأ في قراءة لوحات سيارات المراجعين</li><li><b>د.</b> مستشفى أغلق خط الهاتف للمواعيد بعد إطلاق مساعد المواعيد بشهر واحد فقط</li></ul></li>
<li><p>مساعد افتراضي يجيب عن أسئلة إعانات السكن في جهة عامة. المقابلات شملت المتقدمين وموظفي الدعم ومالك النظام. أي فئة متأثرة غير مباشرة يغفلها هذا الاختيار غالبًا؟</p><ul><li><b>أ.</b> مالك النظام، لأن قراراته تتأثر بأداء المساعد</li><li><b>ب.</b> المتقدمون، لأنهم أكثر من يستخدم المساعد يوميًا</li><li><b>ج.</b> المؤجرون الذين تعتمد عقودهم على صرف الإعانة في وقتها</li><li><b>د.</b> مورّد النموذج، لأن سمعته تتأثر حين يخطئ المساعد في الإجابات</li></ul></li>
<li><p>أي صياغة خطر في سجل وكيل مشتريات افتراضي تحمل الأجزاء الأربعة؟</p><ul><li><b>أ.</b> صلاحيات الوكيل في نظام المالية أوسع كثيرًا مما تحتاجه مهمته الحالية في الشراء</li><li><b>ب.</b> قد يتضرر الموردون وتتأثر سمعة الجهة إن أخطأ الوكيل</li><li><b>ج.</b> أخطاء الوكيل في طلبات الشراء وأوامر الدفع المختلفة</li><li><b>د.</b> قراءة خاطئة لعرض تجعل الوكيل يختار الأغلى، فتدفع الجهة أكثر</li></ul></li>
<li><p>اقترح مساعد ذكي حالتين لمساعد مواعيد افتراضي: «مستخدم يحجز مواعيد كثيرة ليبيعها» و«برنامج آلي يحجز المواعيد لحظة فتحها لإعادة بيعها». ماذا تفعل بهما في السجل؟</p><ul><li><b>أ.</b> تكتبهما خطرين لأن المسبب في الأولى إنسان وفي الثانية برنامج</li><li><b>ب.</b> تكتب خطرًا واحدًا وتعلّمه «اقترحه مساعد» مع سبب القبول</li><li><b>ج.</b> تحذفهما لأن ما يقترحه المساعد لا يدخل سجلًا معتمدًا</li><li><b>د.</b> تؤجلهما حتى تقع حادثة تثبت أن الحجز الجماعي ممكن فعلًا</li></ul></li>
<li><p>في تحليل أنماط الفشل لمساعد افتراضي يحسب غرامات التأخير، كُتب في عمود الاكتشاف لخطوة الحساب: «شكوى المستخدم». لماذا يُعد هذا ضعيفًا؟</p><ul><li><b>أ.</b> لأن الشكاوى تصل إلى مركز الاتصال لا إلى مكتب المخاطر</li><li><b>ب.</b> لأن تحليل أنماط الفشل لا يقبل إلا ضوابط تقنية آلية</li><li><b>ج.</b> لأن المستخدم لا يعرف المبلغ الصحيح، فقد لا يشتكي أبدًا</li><li><b>د.</b> لأن الشكوى تُحتسب في الأثر لا في عمود الاكتشاف من الورقة</li></ul></li>
<li><p>سجل مساعد افتراضي لخدمات البلدية يغطي ست فئات، ولا خطر فيه في فئة الآثار الاجتماعية والاقتصادية والبيئية. ما الخطوة الصحيحة؟</p><ul><li><b>أ.</b> تضيف خطرًا عامًا في الفئة حتى تكتمل التغطية</li><li><b>ب.</b> تسأل عنها، فإن لم تجد خطرًا تكتب السبب وتوقّع</li><li><b>ج.</b> تتركها لأن الفئة لا تخص المساعدات الحوارية عادة</li><li><b>د.</b> تدمجها في فئة المعلومات المضللة لأنها الأقرب إلى المساعدات</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: التقدير والمعايرة والمعالجة</h2>
<ol>
<li><p>في مساعد مواعيد لمستشفى افتراضي، الرسائل التذكيرية تُرسل إلى رقم قديم، والمريض لا يعلم أن هناك تذكيرًا، والعيادة ترى غيابًا فقط. أي أسلوب تحديد يكشف هذا الخطر قبل أن يقع؟</p><ul><li><b>أ.</b> البحث في سجلات الحوادث العامة عن تذكيرات ضائعة</li><li><b>ب.</b> تحليل أنماط الفشل خطوة بخطوة مع عمود الاكتشاف لكل خطوة</li><li><b>ج.</b> مقابلة المرضى وسؤالهم عن مشكلات التذكير التي واجهوها هذا العام</li><li><b>د.</b> كتابة حالات إساءة الاستخدام من منظور مستخدم مسيء</li></ul></li>
<li><p>قدّر زميل خطر «موعد عند طبيب غائب» في المستشفى الافتراضي: الاحتمالية 2، والأثر 4 (كارثي)، والمستوى 8 مرتفع. عامل الأثر: «المرضى سيغضبون كثيرًا». ما الرد الأدق؟</p><ul><li><b>أ.</b> التقدير مقبول ما دام كل رقم معه عامل مكتوب في الورقة</li><li><b>ب.</b> الاحتمالية يجب أن تكون 4 فالخطأ يتكرر، والمستوى 16</li><li><b>ج.</b> يُعتمد متوسط المحورين، 3، فالفرق بينهما كبير ولا يتفق عليه أحد</li><li><b>د.</b> الغضب لا يبلغ الكارثي؛ الأثر 2، والمستوى 4</li></ul></li>
<li><p>مقيّمان في المستشفى الافتراضي قدّرا عشرين خطرًا، واتفقا ضمن نطاق واحد في 85% منها، وفي النطاق نفسه في 35%. يقول مدير المشروع: «المعايرة ناجحة، نعتمد التقدير». ما الرد الأدق؟</p><ul><li><b>أ.</b> 85% قريبة من الصدفة، و35% ضعيفة؛ نناقش الفروق الكبيرة بعواملها</li><li><b>ب.</b> المعايرة ناجحة لأن 85% أعلى من معيار الدليل البالغ 80%</li><li><b>ج.</b> نعتمد متوسط تقديري المقيّمين لكل خطر ثم نعيد حساب الاتفاق</li><li><b>د.</b> نسب الاتفاق لا معنى لها في التقدير، فالمهم رأي المقيّم الأقدم في الفريق</li></ul></li>
<li><p>مساعد المواعيد الافتراضي يرسل تذكيراته عبر مورّد رسائل نصية. انقطاع المورّد يترك المرضى بلا تذكير، والمستشفى لا يتحكم في المورّد ولا يستطيع الاستغناء عن التذكير. أي خيار هو الأنسب أولًا؟</p><ul><li><b>أ.</b> التجنب بإيقاف التذكير النصي كليًا وترك تذكّر الموعد على المريض وأسرته</li><li><b>ب.</b> القبول، لأن الانقطاع خارج تحكم المستشفى</li><li><b>ج.</b> النقل بعقد فيه تعويض وقناة بديلة، والمسؤولية تبقى على المستشفى</li><li><b>د.</b> مراجعة شهرية لعدد المواعيد الفائتة بعد كل انقطاع في الرسائل</li></ul></li>
<li><p>في المستشفى الافتراضي: مالك النظام يعتمد المنخفض والمتوسط، والرئيس التنفيذي للمخاطر المرتفع، وحد فئة الخصوصية والأمن 4، وما فوق الحد يُصعَّد إلى لجنة المخاطر. متبقي خطر خصوصية بعد الضوابط 3×2=6. من يوقّع؟</p><ul><li><b>أ.</b> مالك النظام، لأن 6 في النطاق المتوسط الذي يعتمده</li><li><b>ب.</b> لجنة المخاطر، لأن 6 فوق حد الفئة مهما كان نطاق المتبقي</li><li><b>ج.</b> الرئيس التنفيذي للمخاطر، لأن تجاوز الحد يجعل الخطر مرتفعًا في السجل</li><li><b>د.</b> لا أحد، ويعود الفريق ليضيف ضوابط حتى يصل المتبقي إلى 4</li></ul></li>
<li><p>خطر في مساعد افتراضي لجهة تعليمية: احتماليته 3 وأثره 3. ما مستواه ونطاقه على مصفوفة الإطار الوطني؟</p><ul><li><b>أ.</b> 6، متوسط (الدرجتان متقاربتان)</li><li><b>ب.</b> 9، مرتفع (من 8 إلى 12)</li><li><b>ج.</b> 9، كارثي (أعلى من ثمانية)</li><li><b>د.</b> 12، مرتفع (الأثر يُضاعف عند التساوي)</li></ul></li>
<li><p>قدّر مقيّم أثر خطر «رد غير لائق في محادثة واحدة مع مساعد خدمة» بـ4 (كارثي)، وكتب العامل: «يسيء إلى سمعة الجهة». ما الحكم على هذا التقدير؟</p><ul><li><b>أ.</b> مقبول، لأن السمعة من فئات الأثر في الإطار الوطني</li><li><b>ب.</b> مقبول إذا كانت الاحتمالية منخفضة، فيبقى المستوى معقولًا</li><li><b>ج.</b> يرفع الأثر إلى أعلى درجة لأن أي إساءة غير مقبولة في الجهات العامة</li><li><b>د.</b> مبالغ فيه: الكارثي للحالات القصوى، ورد واحد لا يبلغها</li></ul></li>
<li><p>تقرير معايرة في جهة افتراضية يقول: «اتفق المقيّمون ضمن نطاق واحد في 82% من المخاطر، فالتقدير موثوق». ما الذي ينقص التقرير ليُعتمد هذا الحكم؟</p><ul><li><b>أ.</b> نسبة الاتفاق في النطاق نفسه، والمخاطر التي يفصلها نطاقان</li><li><b>ب.</b> متوسط تقديرات المقيّمين لكل خطر في السجل كله</li><li><b>ج.</b> عدد المخاطر المرتفعة قبل المعايرة وبعدها</li><li><b>د.</b> توقيع الرئيسة التنفيذية للمخاطر على التقرير ونتيجته النهائية</li></ul></li>
<li><p>قدّر مقيّم احتمالية خطر بـ1 والآخر بـ3، والأثر عند كليهما 3. ما الطريقة الصحيحة للحسم؟</p><ul><li><b>أ.</b> اعتماد المتوسط 2، لأنه يجمع الرأيين بإنصاف</li><li><b>ب.</b> اعتماد رأي المقيّم الأقدم في الفريق، لأنه أعرف بالجهة</li><li><b>ج.</b> يكتب كل منهما عامله، ثم يُعاد التقدير من العامل المتفق عليه</li><li><b>د.</b> اعتماد الرقم الأعلى دائمًا، لأن الحذر أولى في إدارة المخاطر العامة</li></ul></li>
<li><p>وكيل مشتريات افتراضي يستطيع أن يصدر أمر دفع دون اعتماد، والميزة توفر دقائق فقط على الموظف. الخطر مرتفع. أي خيار هو الأنسب أولًا؟</p><ul><li><b>أ.</b> التخفيف بمراجعة شهرية لعينة من أوامر الدفع الصادرة</li><li><b>ب.</b> التجنب بإزالة صلاحية إصدار أمر الدفع من الوكيل كليًا</li><li><b>ج.</b> النقل بتأمين يغطي المدفوعات الخاطئة بعد وقوعها</li><li><b>د.</b> القبول، لأن الوكيل نادرًا ما يخطئ في تجارب القبول الأولى</li></ul></li>
<li><p>أي ضابط يخفض احتمالية الخطر لا أثره؟</p><ul><li><b>أ.</b> تقرير أسبوعي بالأخطاء التي وقعت في إجابات المساعد</li><li><b>ب.</b> أولوية في الخدمة لمن تضرر من إجابة خاطئة</li><li><b>ج.</b> ربط إجابات الرسوم بالحاسبة الرسمية بدل المقالات</li><li><b>د.</b> تأمين يغطي مطالبات المتضررين من الإجابات الخاطئة بعد وقوعها</li></ul></li>
<li><p>خطة معالجة لوكيل سفر افتراضي فيها ضابط: «يضغط الموظف (اعتمدت) قبل تأكيد أي حجز». الموظف يعتمد ثمانين حجزًا في الساعة. ما الحكم على هذا الإشراف؟</p><ul><li><b>أ.</b> حقيقي، لأن الضغط إلزامي ولا يُؤكَّد أي حجز للمسافر دونه</li><li><b>ب.</b> حقيقي إذا أضيف تقرير شهري بعدد الضغطات</li><li><b>ج.</b> لا يُحكم عليه إلا بعد أن تقع حادثة</li><li><b>د.</b> شكلي: لا وقت للتحقق، والضغط وحده لا يدل على أن أحدًا قرأ الحجز</li></ul></li>
<li><p>في جهة افتراضية: مالك النظام يعتمد المتوسط، وحد فئة التحيز والتمييز 4، وما فوق الحد يُصعَّد إلى لجنة المخاطر. متبقي خطر تمييز بعد الضوابط 2×3=6. ما القرار الصحيح؟</p><ul><li><b>أ.</b> يعتمده مالك النظام لأن 6 في النطاق المتوسط</li><li><b>ب.</b> يُصعَّد إلى لجنة المخاطر لأن 6 فوق حد الفئة</li><li><b>ج.</b> يُخفض الأثر إلى 2 في الورقة حتى يصل المتبقي إلى 4</li><li><b>د.</b> يُقبل تلقائيًا لأن المتبقي أقل من الدرجة الأصلية للخطر</li></ul></li>
<li><p>في مساعد افتراضي لخدمات البلدية، ضابطان يخفضان احتمالية خطر رسائل احتيال باسم المساعد من 3 إلى 2: تحقق برمز في كل رسالة رسمية بـ50 ألف ريال سنويًا، ومركز اتصال للتحقق على مدار الساعة بـ600 ألف. ماذا تكتب في الخطة؟</p><ul><li><b>أ.</b> رمز التحقق، إلا إن أثبت المركز خفضًا أكبر أو ثقة أعلى</li><li><b>ب.</b> الاثنين معًا، لأن المتبقي ينخفض أكثر بضابطين</li><li><b>ج.</b> المركز، لأن الأغلى أقوى دائمًا في الخطر المرتفع</li><li><b>د.</b> لا شيء حتى تُحسب الخسارة المتوقعة بالريال لكل سيناريو محتمل</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 4: المراقبة وإعادة التقييم واللجنة</h2>
<ol>
<li><p>خطة معالجة لمساعد المواعيد الافتراضي تقول: «تقرير يومي بالمواعيد المحجوزة عند أطباء في إجازة يخفض احتمالية الخطر من 3 إلى 1». ما الخطأ؟</p><ul><li><b>أ.</b> التقرير كاشف يقصّر مدة الضرر، ولا يمنع الحجز الخاطئ من الأصل</li><li><b>ب.</b> لا خطأ في المحور، لكن الخفض مستويان كثير على ضابط واحد</li><li><b>ج.</b> التقرير لا يصلح ضابطًا لأن الضوابط الكاشفة لا تُكتب في خطط المعالجة</li><li><b>د.</b> الخطأ في التكرار: لو كان التقرير كل ساعة لخفض الاحتمالية فعلًا</li></ul></li>
<li><p>لوحة مساعد المواعيد الافتراضي فيها أربعة أرقام أسبوعية. أيها مؤشر خطر رئيس سابق لخطر «موعد عند طبيب غائب»؟</p><ul><li><b>أ.</b> عدد المواعيد المحجوزة عبر المساعد هذا الأسبوع</li><li><b>ب.</b> عدد شكاوى المرضى من مواعيد لم تُقم في هذا الأسبوع</li><li><b>ج.</b> الأيام التي تأخر فيها رفع قائمة الأطباء</li><li><b>د.</b> متوسط تقييم المرضى للمساعد في استبيان الأسبوع من خمسة</li></ul></li>
<li><p>مؤشر المواعيد الخاطئة في المستشفى الافتراضي: أصفر عند 3 من 100، وأحمر عند 6 أو أسبوعين أصفرين متتاليين. هذا الأسبوع 4 بعد عشرة أسابيع خضراء. ماذا تفعل؟</p><ul><li><b>أ.</b> تسجله، وتراجع سجل التغيير، وتنتظر الأسبوع التالي قبل التصعيد</li><li><b>ب.</b> تصعده فورًا إلى لجنة المخاطر لأن العتبة تجاوزت</li><li><b>ج.</b> لا شيء، فالأسابيع العشرة الخضراء السابقة تثبت أن الضابط يعمل جيدًا</li><li><b>د.</b> ترفع العتبة الصفراء إلى 5 لأن 4 قريبة من الضجيج المعتاد</li></ul></li>
<li><p>مورّد الرسائل في المستشفى الافتراضي يُشعر: «من الشهر القادم تُحفظ نصوص الرسائل 180 يومًا بدل 7 أيام لأغراض الجودة». أي خطر في السجل يجب أن يُعاد تقديره أولًا؟</p><ul><li><b>أ.</b> رسائل التذكير تُرسل إلى رقم قديم فلا تصل إلى المريض</li><li><b>ب.</b> انقطاع خدمة الرسائل في أوقات الذروة وقبل المواعيد مباشرة بساعات</li><li><b>ج.</b> رسالة تذكير بموعد خاطئ لأن قائمة الأطباء قديمة</li><li><b>د.</b> نصوص الرسائل تكشف نوع العيادة لمن يصل إلى بيانات المورّد</li></ul></li>
<li><p>ورقة لجنة عن وكيل السفر الافتراضي: ثلاثة مخاطر متبقيها ضمن الحدود، وخطر واحد فوق حد فئته وله خياران. أي سطر أول هو الأنسب؟</p><ul><li><b>أ.</b> عرض نتائج تقييم مخاطر وكيل السفر على اللجنة للاطلاع</li><li><b>ب.</b> قبول متبقي ثلاثة مخاطر بشروط مسماة، والاختيار بين خيارين مسمَّيين للخطر الرابع</li><li><b>ج.</b> اعتماد ميزانية كل الضوابط المقترحة في الخطة للسنتين القادمتين</li><li><b>د.</b> الموافقة على إطلاق وكيل السفر لأن تقييم مخاطره اكتمل ووقّعه المكتب</li></ul></li>
<li><p>لوحة مساعد افتراضي لخدمات البلدية فيها: عدد المحادثات، ورضا المستخدمين، وزمن الاستجابة، ونسبة الإجابات الخاطئة في عينة أسبوعية ثابتة. أيها مؤشر خطر رئيس؟</p><ul><li><b>أ.</b> عدد المحادثات، لأن ارتفاعه يعني تعرضًا أكبر للخطر</li><li><b>ب.</b> نسبة الإجابات الخاطئة في العينة الأسبوعية الثابتة</li><li><b>ج.</b> رضا المستخدمين، لأنه ينخفض حين تكثر الأخطاء في الإجابات</li><li><b>د.</b> زمن الاستجابة، لأن التأخر يدل على خلل في النموذج</li></ul></li>
<li><p>بيان تحمّل يقول: «أحمر عند 5% إجابات خاطئة». العينة الأسبوعية 120 إجابة. ما العتبة الحمراء بالعدد؟</p><ul><li><b>أ.</b> 12 إجابة خاطئة أو أكثر في الأسبوع الواحد</li><li><b>ب.</b> 5 إجابات خاطئة أو أكثر، لأن العتبة 5</li><li><b>ج.</b> 6 إجابات خاطئة أو أكثر</li><li><b>د.</b> لا تُحسب العتبة إلا بعد شهر من البيانات</li></ul></li>
<li><p>تضاعف عدد الإجابات الخاطئة التي يعدّها مساعد افتراضي في أسبوع حملة موسمية، وبقيت نسبة الخطأ في العينة الثابتة كما هي. ماذا تستنتج؟</p><ul><li><b>أ.</b> تضاعف الاستخدام والخطر لم يتغير؛ لا تصعيد بسبب العدد</li><li><b>ب.</b> تدهور حقيقي يستدعي التصعيد، لأن الأخطاء تضاعفت</li><li><b>ج.</b> العينة الثابتة خاطئة ويجب أن تتضاعف هي أيضًا</li><li><b>د.</b> لا يمكن الحكم إلا بعد انتهاء الموسم بثلاثة أشهر كاملة</li></ul></li>
<li><p>قاعدة إنذار: أصفر عند 11 خطأ من 200، وأحمر عند 16 أو أسبوعين أصفرين متتاليين. بالمحاكاة عند خطأ أساسي 3%: الأصفر الكاذب في 4% من الأسابيع. ماذا يعني ذلك للفريق؟</p><ul><li><b>أ.</b> تُرفع العتبة الصفراء كلما أنذرت حتى تقل الإنذارات</li><li><b>ب.</b> القاعدة غير صالحة للاستعمال لأن فيها إنذارات كاذبة متكررة</li><li><b>ج.</b> كل أصفر يُصعَّد فورًا لأن 4% احتمال صغير</li><li><b>د.</b> الأصفر الواحد يُسجل ويُبحث عن سببه، ولا يُصعَّد وحده</li></ul></li>
<li><p>أرسل مورّد نموذج إشعارًا: «إيقاف فحص المدخلات من التعليمات المخفية في الإعداد الافتراضي». أي خطر في سجل مساعد خدمة يُعاد تقديره أولًا؟</p><ul><li><b>أ.</b> انقطاع خدمة المورّد في أوقات الذروة وموسم التجديد</li><li><b>ب.</b> رسوم قديمة في مقالات قاعدة المعرفة</li><li><b>ج.</b> حفظ أرقام الهوية في سجلات الجهة</li><li><b>د.</b> كشف تعليمات المساعد الداخلية بنص ملصوق تُخفى فيه أوامر للنموذج</li></ul></li>
<li><p>مورّد يعلن إصدارًا جديدًا من نموذجه «أدق في اللغات غير الإنجليزية». خطر فرق الجودة بين العربية والإنجليزية في سجلك متوسط. ماذا تكتب؟</p><ul><li><b>أ.</b> نخفض احتماليته الآن لأن الإصدار الجديد أدق بحسب إعلان المورّد</li><li><b>ب.</b> نرفع احتماليته لأن أي تغيير في النموذج يزيد الخطر</li><li><b>ج.</b> الدرجة معلقة حتى نقيس الفرق على الإصدار الجديد قبل السريان</li><li><b>د.</b> نحذفه من السجل لأن المورّد عالج السبب بالإصدار الجديد</li></ul></li>
<li><p>أي سطر أول لورقة لجنة مخاطر هو الأنسب؟</p><ul><li><b>أ.</b> نطلب الموافقة على إطلاق النظام بعد اكتمال تقييم مخاطره بنجاح</li><li><b>ب.</b> نعرض على اللجنة نتائج تقييم المخاطر للاطلاع وإبداء الملاحظات والتوجيه بما ترونه مناسبًا</li><li><b>ج.</b> نطلب قبول المتبقي في أربعة مخاطر بشروط مؤشرين، وحسم خطر فوق حده بين خيارين</li><li><b>د.</b> نرفق سجل المخاطر الكامل بعشرين خطرًا ودرجاتها للمراجعة التفصيلية</li></ul></li>
<li><p>في دفاع أمام لجنة، قيل للعارض: «الوكيل سيصدر أوامر الدفع حتى مليون ريال بدل خمسين ألفًا». خطر «أمر دفع خاطئ» كان احتماليته 2 وأثره 2. ما الرد الأدق؟</p><ul><li><b>أ.</b> لا يتغير شيء لأن الضوابط القائمة نفسها تبقى كما هي</li><li><b>ب.</b> الاحتمالية ترتفع إلى 3 لأن المبالغ الأكبر تجعل الخطأ أكثر وقوعًا، فالمستوى 6</li><li><b>ج.</b> المحوران يرتفعان معًا إلى 3، فالمستوى 9 مرتفع</li><li><b>د.</b> الأثر يرتفع إلى 3 لأن الضرر إن وقع أشد، فالمستوى 6 والاحتمالية كما هي</li></ul></li>
<li><p>لماذا يُكتب في ورقة اللجنة بند «ما لم نتحقق منه بعد»؟</p><ul><li><b>أ.</b> ليقرر الأعضاء وهم يعرفون حدود الأدلة</li><li><b>ب.</b> ليُعفى مكتب المخاطر من المسؤولية إن وقع خطر لم يُكتب لاحقًا</li><li><b>ج.</b> لأن الإطار الوطني يشترط بندًا بهذا الاسم في كل ورقة</li><li><b>د.</b> ليطلب المكتب مهلة إضافية قبل أي قرار من اللجنة</li></ul></li>
<li><p>رئيسة لجنة مخاطر تسأل العارض: «لماذا نقبل متبقيًا من 6 في خطر الانتحال؟». أي جواب هو الأقوى؟</p><ul><li><b>أ.</b> لأن كل المخاطر المتوسطة في السجل قُبلت بالطريقة نفسها من قبل</li><li><b>ب.</b> لأن الجهة لا تستطيع أن تمنع الانتحال في منصات تواصل وتطبيقات لا تملكها أصلًا</li><li><b>ج.</b> لأن تكلفة الضوابط الإضافية عالية جدًا على ميزانية هذا العام</li><li><b>د.</b> لأنه ضمن حد الفئة المعتمد، ونعيد فتح القرار إن بلغ مؤشر البلاغات الأحمر</li></ul></li>
<li><p>تقييم مخاطر مساعد خدمة اكتمل واعتمدته اللجنة. ما الذي يُسلَّم إلى فريق الاستجابة للحوادث؟</p><ul><li><b>أ.</b> وثيقة تقييم الأثر على الحقوق والفئات المتأثرة</li><li><b>ب.</b> المؤشرات وعتباتها الحمراء ومن يُبلَّغ عند كل منها</li><li><b>ج.</b> بنود العقد الخاصة بالاحتفاظ بالبيانات ومنطقة المعالجة</li><li><b>د.</b> سجل المخاطر كله بدرجاته ليعيدوا تقييمه من البداية</li></ul></li>
<li><p>مستوى التقبّل لفئة الخصوصية والأمن في جهة افتراضية «متجنّب»، وحد المتبقي فيها 4. خطر في الفئة متبقيه 6 ونطاقه متوسط. ما الذي يقوله بيان التقبّل عنه؟</p><ul><li><b>أ.</b> يُصعَّد إلى لجنة المخاطر لأن متبقيه فوق حد فئته، مهما كان نطاقه المتوسط</li><li><b>ب.</b> يعتمده مالك النظام لأن المتوسط من صلاحيته</li><li><b>ج.</b> يُقبل لأن المستوى المتجنّب لا ينطبق على المخاطر المتوسطة</li><li><b>د.</b> يُحذف من السجل مؤقتًا حتى تُضاف له ضوابط تعيده تحت الحد المعتمد</li></ul></li>
</ol>
